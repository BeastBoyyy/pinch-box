<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 430" width="1190" height="430" role="img" aria-label="Pinch-Box architecture: camera frames go to a hand tracking worker, then validation, gesture logic and per-box pipelines; a segmentation worker feeds a shared person mask to the effect passes; the WebGL2 renderer shows the same frame the landmarks came from">
<rect width="1190" height="430" rx="16" fill="#0d0f1a"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="40" y="44" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1">HAND PATH  ·  every camera frame</text>
  <text x="270" y="264" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="1">PERSON MASK PATH  ·  only while a box needs it</text>
  <path id="a" d="M230 107 L270 107" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle><path id="b" d="M460 107 L500 107" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.7s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle><path id="c" d="M690 107 L730 107" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.5s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle><path id="d" d="M920 107 L960 107" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle>
  <path id="e" d="M1055 144 L1055 290" fill="none" stroke="#7dd3fc" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#e"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#e"/></animateMotion></circle><circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.6s" begin="1.9s" repeatCount="indefinite"><mpath href="#e"/></animateMotion></circle>
  <path id="f" d="M135 144 L135 327 L270 327" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#c4b5fd"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="2.2s" begin="1.5s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle>
  <path id="g" d="M460 327 L500 327" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#g"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#g"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#g"/></animateMotion></circle><path id="h" d="M690 327 L730 327" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#h"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath href="#h"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#h"/></animateMotion></circle><path id="i" d="M920 327 L960 327" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".5"/><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="0.7s" repeatCount="indefinite"><mpath href="#i"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#i"/></animateMotion></circle><circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#i"/></animateMotion></circle>
  <path id="j" d="M405 144 L405 208 L1015 208 L1015 290" fill="none" stroke="#ffd166" stroke-width="2" opacity=".5" stroke-dasharray="6 6"/><circle r="4.5" fill="#ffd166"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite"><mpath href="#j"/></animateMotion></circle><circle r="4.5" fill="#ffd166"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#j"/></animateMotion></circle><circle r="4.5" fill="#ffd166"><animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#j"/></animateMotion></circle>
  <text x="710" y="198" text-anchor="middle" fill="#ffd166" font-size="13.5" font-weight="600">the exact frame the landmarks came from is what gets displayed, so the box sits on the fingers</text>
  <g><rect x="40" y="70" width="190" height="74" rx="12" fill="#151a2b" stroke="#7dd3fc" stroke-width="1.6"/><text x="135" y="102" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Camera</text><text x="135" y="124" text-anchor="middle" fill="#9aa3c7" font-size="12.5">rVFC capture time</text></g><g><rect x="270" y="70" width="190" height="74" rx="12" fill="#151a2b" stroke="#7dd3fc" stroke-width="1.6"/><text x="365" y="102" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">tracker.worker</text><text x="365" y="124" text-anchor="middle" fill="#9aa3c7" font-size="12.5">MediaPipe hands, GPU</text></g><g><rect x="500" y="70" width="190" height="74" rx="12" fill="#151a2b" stroke="#7dd3fc" stroke-width="1.6"/><text x="595" y="102" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">HandTracker</text><text x="595" y="124" text-anchor="middle" fill="#9aa3c7" font-size="12.5">identity + gates + filters</text></g><g><rect x="730" y="70" width="190" height="74" rx="12" fill="#151a2b" stroke="#7dd3fc" stroke-width="1.6"/><text x="825" y="102" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">GestureEngine</text><text x="825" y="124" text-anchor="middle" fill="#9aa3c7" font-size="12.5">pinch FSM, lock look-back</text></g><g><rect x="960" y="70" width="190" height="74" rx="12" fill="#151a2b" stroke="#7dd3fc" stroke-width="1.6"/><text x="1055" y="102" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Pipeline</text><text x="1055" y="124" text-anchor="middle" fill="#9aa3c7" font-size="12.5">per-box targets + governor</text></g><g><rect x="270" y="290" width="190" height="74" rx="12" fill="#151a2b" stroke="#c4b5fd" stroke-width="1.6"/><text x="365" y="322" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">seg.worker</text><text x="365" y="344" text-anchor="middle" fill="#9aa3c7" font-size="12.5">selfie segmenter, 5 ms</text></g><g><rect x="500" y="290" width="190" height="74" rx="12" fill="#151a2b" stroke="#c4b5fd" stroke-width="1.6"/><text x="595" y="322" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">SegProvider</text><text x="595" y="344" text-anchor="middle" fill="#9aa3c7" font-size="12.5">temporal mask + mips</text></g><g><rect x="730" y="290" width="190" height="74" rx="12" fill="#151a2b" stroke="#c4b5fd" stroke-width="1.6"/><text x="825" y="322" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Effect passes</text><text x="825" y="344" text-anchor="middle" fill="#9aa3c7" font-size="12.5">GLSL, 3 presets each</text></g><g><rect x="960" y="290" width="190" height="74" rx="12" fill="#151a2b" stroke="#ffd166" stroke-width="1.6"/><text x="1055" y="322" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">WebGL2 renderer</text><text x="1055" y="344" text-anchor="middle" fill="#9aa3c7" font-size="12.5">half-float scene, sRGB out</text></g>
  <text x="40" y="402" fill="#6b7396" font-size="12.5">All inference and rendering run on the client. No frame ever leaves the machine.</text>
</g></svg>